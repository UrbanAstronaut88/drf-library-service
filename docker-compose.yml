services:
  db:
    image: postgres:15
    container_name: db
    env_file:
      - .env
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    restart: always

  redis:
    container_name: redis_service
    image: redis:7
    ports:
      - "6379:6379"
    restart: always

  web:
    build: .
    container_name: web
    command: python manage.py runserver 0.0.0.0:8000
    volumes:
      - .:/app
    ports:
      - "8000:8000"
    depends_on:
      - db
      - redis
    env_file:
      - .env

  telegram-bot:
    build: .
    container_name: telegram-bot
    command: python manage.py runscript telegram_bot
    volumes:
      - .:/app
    depends_on:
      - web
      - redis
    env_file:
      - .env

  celery:
    build: .
    container_name: celery
    command: celery -A config worker -l info
    volumes:
      - .:/app
    depends_on:
      - web
      - redis
    env_file:
      - .env

  celery-beat:
    build: .
    container_name: celery-beat
    command: celery -A config beat -l info
    volumes:
      - .:/app
    depends_on:
      - web
      - redis
    env_file:
      - .env

volumes:
  postgres_data:
